<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NODO · Banqueta Cruz</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f7f6f2;font-family:Arial,Helvetica,sans-serif;color:#111}
    .wrap{max-width:1100px;margin:auto;padding:16px}
    h1{text-align:center;font-size:18px;letter-spacing:.08em;margin:6px 0 12px}
    .controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
    .controls button,.ar{border:1px solid #111;background:#fff;color:#111;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
    .controls button.active{background:#111;color:#fff}
    .ar{display:block;margin:0 auto 12px;background:#111;color:#fff;font-size:16px}
    .note{text-align:center;font-size:13px;color:#666;margin:0 0 12px}
    .viewer-layout{display:flex;gap:24px;align-items:center}
    .viewer-layout model-viewer{flex:1;min-width:0}
    .qr-side{width:200px;flex:0 0 200px;text-align:center}
    .qr-side p{font-size:14px;font-weight:bold;margin:0 0 12px}
    .qr-side img{display:block;width:180px;height:180px;margin:auto}
    model-viewer{width:100%;height:70vh;min-height:520px;background:#fff;border-radius:18px}
    @media(max-width:700px){
      .wrap{padding:8px}
      .viewer-layout{flex-direction:column}
      .viewer-layout model-viewer{width:100%;height:72vh;min-height:480px;flex:auto}
      .qr-side{width:100%;flex:auto}
      model-viewer{height:72vh;min-height:480px}
      h1{font-size:16px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>BANQUETA CRUZ · NODO</h1>

    <div class="controls">
      <button class="active" data-src="NODO_BANQUETA_CRUZ_KIRI_V3_MAESTRO_CORREGIDO.glb">KIRI</button>
      <button data-src="NODO_BANQUETA_CRUZ_PARAISO_V3_MAESTRO_CORREGIDO.glb">PARAÍSO</button>
      <button data-src="NODO_BANQUETA_CRUZ_CUARZO_V3_MAESTRO_CORREGIDO.glb">CUARZO</button>
    </div>

    <button class="ar" id="arBtn">PROBALO EN TU CASA</button>
    <div class="note">Elegí el color, girá la banqueta y probala en tu casa desde el celular.</div>

    <div class="viewer-layout">
    <model-viewer id="viewer"
      src="NODO_BANQUETA_CRUZ_KIRI_V3_MAESTRO_CORREGIDO.glb"
      alt="Banqueta Cruz NODO"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1"
      shadow-softness=".8"
      exposure="1"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="floor"
      ar-scale="fixed"
      environment-image="neutral">
    </model-viewer>
      <div class="qr-side">
        <p>ESCANEÁ Y PROBALO EN TU CASA</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&amp;data=https%3A%2F%2Fproba.nodomuebles.com.ar%2Fbanqueta-cruz.html" alt="QR Banqueta Cruz NODO" width="180" height="180">
      </div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const buttons = [...document.querySelectorAll('.controls button')];

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        button.classList.add('active');
        viewer.src = button.dataset.src;
      });
    });

    document.getElementById('arBtn').addEventListener('click', () => {
      if (viewer.activateAR) viewer.activateAR();
    });
  </script>
</body>
</html>
