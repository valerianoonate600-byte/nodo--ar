<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NODO · Mesa Ratona Pórtico</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f1ec;color:#171717}
header{padding:18px 16px;text-align:center}h1{font-size:19px;letter-spacing:.08em;margin:0 0 8px}
p{font-size:13px;line-height:1.45;margin:6px auto;max-width:780px}
.warn{font-weight:bold;color:#763a1f}.colors{display:flex;justify-content:center;gap:10px;margin:15px 0}
.colors button{padding:10px 18px;border:1px solid #111;border-radius:30px;background:white;cursor:pointer;font-weight:bold}
.colors button.active{background:#111;color:white}
model-viewer{display:block;width:min(95vw,1000px);height:66vh;min-height:420px;margin:auto;background:white;border-radius:18px}
footer{text-align:center;padding:12px;font-size:12px;color:#555}
.viewer-layout{display:flex;gap:20px;align-items:center;max-width:1200px;margin:auto;padding:0 12px}.viewer-layout model-viewer{flex:1;min-width:0;width:100%;margin:0}.qr-side{flex:0 0 200px;width:200px;text-align:center}.qr-side p{font-size:13px;font-weight:700;margin:0 0 12px}.qr-side img{display:block;width:180px;height:180px;margin:auto}@media(max-width:750px){.viewer-layout{flex-direction:column}.viewer-layout model-viewer{width:100%;flex:auto}.qr-side{flex:auto;width:100%}}
.ar-button{display:none;margin:8px auto 14px;padding:13px 22px;border:0;border-radius:999px;background:#111;color:#fff;font:bold 14px Arial;cursor:pointer}model-viewer::part(default-ar-button){display:block}@media(max-width:750px){.ar-button{display:block}}
</style></head><body>
<header><h1>NODO · MESA RATONA PÓRTICO</h1>

<p>Elegí el color y girá la mesa para verla desde todos sus ángulos.</p>
<div class="colors">
<button class="active" data-file="NODO_MESA_COMEDOR_PORTICO_KIRI_UV_LIMPIO_V2.glb">KIRI</button>
<button data-file="NODO_MESA_COMEDOR_PORTICO_PARAISO_UV_LIMPIO_V2.glb">PARAÍSO</button>
<button data-file="NODO_MESA_COMEDOR_PORTICO_CUARZO_UV_LIMPIO_V2.glb">CUARZO</button>
</div></header>
<div class="viewer-layout"><model-viewer id="m" src="NODO_MESA_COMEDOR_PORTICO_KIRI_UV_LIMPIO_V2.glb" scale="0.857 0.548 0.75" camera-controls ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed" auto-rotate-delay="1000000" interaction-prompt="none" shadow-intensity="1" exposure="1" environment-image="neutral" alt="Vista 3D de mesa ratona Pórtico NODO"><button class="ar-button" slot="ar-button" type="button">PROBALO EN TU CASA</button></model-viewer><aside class="qr-side"><p>ESCANEÁ Y ABRILO EN TU CELULAR</p><img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&amp;data=https%3A%2F%2Fproba.nodomuebles.com.ar%2Fmesa-ratona-portico-comparacion.html" alt="Código QR para abrir el visor de mesa ratona Pórtico en el celular"></aside></div>
<footer>Giralo con el mouse o con el dedo. En teléfonos compatibles, seleccioná «PROBALO EN TU CASA» para iniciar la realidad aumentada.</footer>
<script>const m=document.getElementById('m');document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-file]').forEach(x=>x.classList.remove('active'));b.classList.add('active');m.src=b.dataset.file;});</script>
</body></html>
