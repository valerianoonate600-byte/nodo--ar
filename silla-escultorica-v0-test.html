<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
<style>
html, body { margin:0; width:100%; height:100%; background:#fff; font-family:Arial,sans-serif; }
model-viewer { width:100%; height:100vh; background-color:#eeeeee; }
#topControls { position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; align-items:center; gap:10px; }
#badge { padding:9px 14px; background:rgba(255,255,255,0.96); border:1px solid #d7d7d7; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.08); font-size:13px; font-weight:700; color:#222; }
#hint { position:fixed; left:20px; bottom:20px; z-index:9998; max-width:330px; padding:10px 12px; background:rgba(255,255,255,0.94); border:1px solid #d7d7d7; border-radius:8px; font-size:12px; line-height:1.35; color:#444; }
@media (max-width:768px) { #topControls { top:14px; width:94%; } #hint { left:12px; right:12px; bottom:12px; max-width:none; } }
</style>
</head>
<body>
<model-viewer id="silla" src="silla_escultorica_v0.glb" camera-controls touch-action="pan-y" exposure="0.7" shadow-intensity="1" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed"></model-viewer>
<div id="topControls"><div id="badge">SILLA ESCULTÓRICA · V0 GEOMETRÍA</div></div>
<div id="hint">Versión de prueba para validar forma, proporciones y ubicación de piezas. Todavía no es la versión final de materiales ni el modelo CNC.</div>
</body>
</html>
