<body><!DOCTYPE html><!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background: #ffffff;
    }

    .ar-button {
      background: #ffffff;
      border: 1px solid #222222;
      padding: 14px 24px;
      font-size: 15px;
      cursor: pointer;
      position: absolute;
      left: 50%;
      bottom: 260px;
      transform: translateX(-50%);
    }
  </style>
</head>

<body>

  <model-viewer
    src="Rack_Sistema_Kiri_AR_escala_real.glb"
    alt="Rack Sistema NODO en melamina Faplac Kiri"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed">

    <button slot="ar-button" class="ar-button">
      VER EN TU ESPACIO
    </button>

  </model-viewer>

</body>
</html>
