<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background: #fff;
    }

    #arBtn {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 12px 22px;
      border: 1px solid #222;
      border-radius: 5px;
      background: #fff;
      color: #222;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <model-viewer
    id="rack"
   src="RACK_KIRI_FOTOGRAFICO_V7.glb"
    alt="Rack Sistema NODO en melamina Faplac Kiri"
    camera-controls
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed">
  </model-viewer>

  <button id="arBtn">VER EN TU ESPACIO</button>

  <script>
    const rack = document.getElementById('rack');
    const arBtn = document.getElementById('arBtn');

    arBtn.addEventListener('click', () => {
      rack.activateAR();
    });
  </script>

</body>
</html>
