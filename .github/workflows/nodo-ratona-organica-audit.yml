name: NODO auditoría ratona orgánica
on:
  push:
    paths: ['.github/workflows/nodo-ratona-organica-audit.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install trimesh numpy matplotlib scipy
      - name: Comparar geometrías y postura de mesas ratonas
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np, trimesh, json
          files=['NODO_MESA_RATONA_ORGANICA_KIRI_V1.glb','NODO_MESA_RATONA_ORGANICA_KIRI_V2.glb','NODO_MESA_RATONA_ORGANICA_KIRI_V3.glb','NODO_RATONA_CRUZ_KIRI_V1.glb','NODO_MESA_RATONA_EN_CRUZ_KIRI_V14_AR_YUP.glb']
          for name in files:
            try:
              sc=trimesh.load(name,force='scene')
              m=list(sc.dump())
              b=sc.bounds
              nodes={}
              for geom in m:
                ex=geom.extents
                normals=np.abs(geom.face_normals)
                areas=geom.area_faces
                node={'extents':np.round(ex,4).tolist(),'bounds':np.round(geom.bounds,4).tolist(),
                      'dominantAxesArea':np.round((normals*areas[:,None]).sum(axis=0)/areas.sum(),3).tolist(),
                      'faces':len(geom.faces),
                      'name':geom.metadata.get('name'),
                      'material':str(getattr(getattr(geom.visual,'material',None),'name',None))}
                nodes.setdefault('list',[]).append(node)
              print('CANDIDATE '+json.dumps({'file':name,'bounds':np.round(b,4).tolist(),
                'extents':np.round(sc.extents,4).tolist(),'pieces':len(m),
                'nodes':nodes['list'][:12]},ensure_ascii=False))
            except Exception as e:print('ERR',name,str(e))
          PY
