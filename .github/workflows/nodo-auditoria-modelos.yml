name: Auditar modelos pendientes NODO
on:
  push:
    paths:
      - '.github/workflows/nodo-auditoria-modelos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install trimesh numpy matplotlib pillow
      - name: Geometria y vistas de control
        shell: bash
        run: |
          python - <<'PY'
          import trimesh, numpy as np, os, json
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          from matplotlib.collections import PolyCollection
          os.makedirs('nodo_qa',exist_ok=True)
          files=[
           'NODO_COMEDOR_COUNTRY_KIRI_V1_REVISION.glb',
           'NODO_COMEDOR_CRUZ_KIRI_V1.glb',
           'NODO_MESA_REDONDA_CRUZ_KIRI_V4.glb',
           'NODO_RATONA_CRUZ_KIRI_V1.glb',
           'NODO_MESA_RATONA_EN_CRUZ_KIRI_V14_AR_YUP.glb',
           'NODO_SILLA_ESCULTORICA_SEIS_PIEZAS_FINAL_GEOMETRIA_V1.glb',
           'NODO_SILLA_ESCULTORICA_RECUPERADA_VERSION_BUENA.glb'
          ]
          allr=[]
          for fname in files:
           try:
            sc=trimesh.load(fname,force='scene')
            mes=sc.dump()
            parts=[m for m in mes if isinstance(m,trimesh.Trimesh) and len(m.vertices)>0]
            if not parts: raise Exception('sin geometria')
            allpoints=np.concatenate([m.vertices for m in parts])
            bounds=np.array([allpoints.min(axis=0), allpoints.max(axis=0)])
            dims=(bounds[1]-bounds[0]).round(5).tolist()
            nodes=list(sc.graph.nodes_geometry)
            data={'filename':fname,'extent_xyz':dims,'bounds_xyz':bounds.round(5).tolist(),'mesh_count':len(parts),'scene_node_count':len(nodes),'faces':sum(len(m.faces) for m in parts)}
            allr.append(data)
            print(json.dumps(data,ensure_ascii=False))
            fig,axs=plt.subplots(1,3,figsize=(13,4),dpi=130)
            for ax,(a,b),title in zip(axs,[(0,1),(0,2),(1,2)],['vista 1','vista 2','vista 3']):
             for m in parts:
              if len(m.faces)>50000:
               faces=m.faces[::max(1,len(m.faces)//4000)]
              else: faces=m.faces[::max(1,len(m.faces)//4000)]
              poly=m.vertices[faces][:,:,[a,b]]
              ax.add_collection(PolyCollection(poly,facecolor='#c3ad8f',edgecolor='#564936',linewidth=.13,alpha=.55))
             ax.set_xlim(bounds[0,a]-.03,bounds[1,a]+.03)
             ax.set_ylim(bounds[0,b]-.03,bounds[1,b]+.03)
             ax.set_aspect('equal')
             ax.set_title(title)
             ax.grid(alpha=.2)
            fig.suptitle(fname+' | '+str(dims),fontsize=9)
            fig.tight_layout()
            fig.savefig('nodo_qa/'+fname.replace('.glb','.png'))
            plt.close(fig)
           except Exception as e:
            print('ERROR',fname,str(e))
            allr.append({'filename':fname,'error':str(e)})
          open('nodo_qa/reporte.json','w').write(json.dumps(allr,indent=2,ensure_ascii=False))
          PY
      - name: Incluir archivos de referencia para revision local
        run: |
          mkdir -p nodo_qa/modelos
          cp NODO_SILLA_ESCULTORICA_SEIS_PIEZAS_FINAL_GEOMETRIA_V1.glb nodo_qa/modelos/
          cp NODO_SILLA_ESCULTORICA_RECUPERADA_VERSION_BUENA.glb nodo_qa/modelos/
          cp NODO_MESA_RATONA_EN_CRUZ_KIRI_V14_AR_YUP.glb nodo_qa/modelos/
          cp NODO_MESA_RATONA_EN_CRUZ_PARAISO_V14_AR_YUP.glb nodo_qa/modelos/
          cp NODO_MESA_RATONA_EN_CRUZ_CUARZO_V14_AR_YUP.glb nodo_qa/modelos/
      - uses: actions/upload-artifact@v4
        with:
          name: nodo-qa-modelos
          path: nodo_qa/
