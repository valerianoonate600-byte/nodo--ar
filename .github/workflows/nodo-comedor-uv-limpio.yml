name: Corregir UV y veta Mesa Pórtico NODO
on:
  push:
    paths: ['.github/workflows/nodo-comedor-uv-limpio.yml']
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy trimesh pillow
      - name: Aplicar materiales originales sin costuras en la tapa
        shell: bash
        run: |
          python - <<'PY'
          import copy, numpy as np, trimesh
          from PIL import Image, ImageOps
          from trimesh.visual.texture import TextureVisuals
          from pathlib import Path
          references={
             'KIRI':'NODO_ARRIME_CRUZ_KIRI_V1.glb',
             'PARAISO':'NODO_ARRIME_CRUZ_PARAISO_V1.glb',
             'CUARZO':'NODO_ARRIME_CRUZ_CUARZO_V1.glb'}
          facenames={'KIRI':'Kiri fotografico','PARAISO':'FAPLAC_PARAISO_CARAS','CUARZO':'CUARZO_CARAS_REFERENCIA_FOTOGRAFICA'}
          Path('nodo_qa_uv').mkdir(exist_ok=True)
          for color, reference in references.items():
              ref=trimesh.load(reference,force='scene')
              mats={}
              for part in ref.geometry.values():
                  if part.visual.kind!='texture':continue
                  mat=part.visual.material
                  if mat.name==facenames[color]:mats['faces']=copy.deepcopy(mat)
                  if mat.name=='MDF fresado fotografico':mats['edge']=copy.deepcopy(mat)
              assert set(mats)=={'faces','edge'},(color,list(mats))
              im=mats['faces'].baseColorTexture.convert('RGB')
              if color=='PARAISO':
                  # The original 180x700 reference image has a white strip on the right.
                  im=im.crop((5,6,im.width-15,min(626,im.height-20)))
              elif color=='KIRI':
                  im=im.crop((3,8,im.width-3,im.height-8))
              if color=='CUARZO':
                  atlas=im.resize((1400,800),Image.Resampling.BICUBIC)
              else:
                  # Grain follows the tabletop length. Mirror across the seam
                  # to make a continuous single 140x80 cm texture rather than four wrap tiles.
                  strip=im.transpose(Image.Transpose.ROTATE_90).resize((1400,400),Image.Resampling.LANCZOS)
                  atlas=Image.new('RGB',(1400,800))
                  atlas.paste(strip,(0,0))
                  atlas.paste(ImageOps.flip(strip),(0,400))
              atlas.save(f'nodo_qa_uv/{color}_tapa_control.jpg',quality=91)
              mat=copy.deepcopy(mats['faces'])
              mat.baseColorTexture=atlas
              master=trimesh.load('NODO_MESA_COMEDOR_PORTICO_'+color+'_APROBADA_DXF.glb',force='scene')
              original_extent=master.extents.copy()
              parts=list(master.dump())
              assert len(parts)==5
              scene=trimesh.Scene()
              for m in parts:
                  d=m.extents
                  if np.argmin(d)==1:
                      kind='top'; axis=1
                  elif np.argmin(d)==2:
                      kind='long'; axis=2
                  elif np.argmin(d)==0:
                      kind='short';axis=0
                  else: raise ValueError(d)
                  normals=np.abs(m.face_normals)
                  faces=normals[:,axis]>.90
                  assert faces.any() and (~faces).any()
                  for role,mask in (('faces',faces),('edge',~faces)):
                      piece=m.submesh([np.flatnonzero(mask)],append=True,repair=False)
                      v=piece.vertices
                      if role=='faces':
                          if kind=='top':
                              # All vertices share the same global UV coordinates across the entire top.
                              uv=np.stack(((v[:,0]+.7)/1.4, (v[:,2]+.4)/.8),axis=1)
                          elif kind=='long':
                              uv=np.stack((v[:,1]/.795,(v[:,0]+.7)/1.4),axis=1)
                          else:
                              uv=np.stack((v[:,1]/.795,(v[:,2]+.4)/.8),axis=1)
                          uv=np.clip(uv,0,1)
                          material=copy.deepcopy(mat)
                      else:
                          if kind=='top':
                              uv=np.stack(((v[:,0]+.7)/1.4,(v[:,2]+.4)/.8),axis=1)
                          elif kind=='long':
                              uv=np.stack((v[:,1]/.795,(v[:,0]+.7)/1.4),axis=1)
                          else:
                              uv=np.stack((v[:,1]/.795,(v[:,2]+.4)/.8),axis=1)
                          uv=np.clip(uv,0,1)
                          material=copy.deepcopy(mats['edge'])
                      piece.visual=TextureVisuals(uv=uv,material=material)
                      scene.add_geometry(piece,geom_name=kind+'_'+role+'_'+str(len(scene.geometry)))
              assert np.allclose(scene.extents,original_extent,atol=1e-5),(scene.extents,original_extent)
              out='NODO_MESA_COMEDOR_PORTICO_'+color+'_UV_LIMPIO_V2.glb'
              scene.export(out)
              check=trimesh.load(out,force='scene')
              assert len(check.geometry)==10
              assert np.allclose(check.extents,original_extent,atol=1e-5)
              # Never rewrite the CNC or the approved geometry.
              print('VALIDADO',out,'medidas',np.round(check.extents,4),'piezas',len(check.geometry),'atlas',atlas.size)
          PY
      - name: Guardar los tres GLB corregidos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NODO_MESA_COMEDOR_PORTICO_*_UV_LIMPIO_V2.glb
          git commit -m "Corregir UV y foto Paraíso sin cortes en mesa Pórtico"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: nodo-mesa-portico-uv-auditoria
          path: nodo_qa_uv/
