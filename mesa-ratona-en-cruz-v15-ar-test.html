<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NODO · Mesa Ratona en Cruz · AR TEST</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#f7f6f2;font-family:Arial,Helvetica,sans-serif;color:#111}
.wrap{max-width:1100px;margin:auto;padding:16px}
h1{text-align:center;font-size:18px;margin:6px 0 12px}
.ar{display:block;margin:0 auto 12px;border:1px solid #111;background:#fff;color:#111;padding:12px 20px;border-radius:5px;font-weight:700;font-size:16px;cursor:pointer}
.note{text-align:center;font-size:13px;color:#666;margin:0 0 12px}
model-viewer{width:100%;height:72vh;min-height:520px;background:#eee;border-radius:18px}
#desktopQr{
  position:fixed;right:24px;bottom:24px;z-index:9998;width:184px;padding:13px;
  background:rgba(255,255,255,.96);border:1px solid #d7d7d7;border-radius:9px;
  box-shadow:0 8px 24px rgba(0,0,0,.11);text-align:center
}
#desktopQr p{margin:0 0 9px;font-size:14px;line-height:1.3;color:#222;font-weight:600}
#desktopQr img{display:block;width:150px;height:150px;margin:0 auto}
#desktopQr small{display:block;margin-top:7px;font-size:11px;line-height:1.25;color:#666}
@media(max-width:768px){#desktopQr{display:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>MESA RATONA EN CRUZ · PRUEBA AR</h1>
<button class="ar" id="arBtn">PROBALO EN TU CASA</button>
<div class="note">Prueba Kiri · misma arquitectura interna de escala/ejes usada en el Rack AR.</div>

<model-viewer id="viewer"
  src="NODO_MESA_RATONA_EN_CRUZ_KIRI_V15_AR_PIPELINE_RACK.glb"
  camera-controls
  touch-action="pan-y"
  shadow-intensity="1"
  shadow-softness=".8"
  exposure="1"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-placement="floor"
  ar-scale="fixed"
  environment-image="neutral">
</model-viewer>
</div>

<div id="desktopQr">
  <p>Escaneá con tu celular para probarlo en tu casa</p>
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https%3A%2F%2Fvalerianoonate600-byte.github.io%2Fnodo--ar%2Fmesa-ratona-en-cruz-v15-ar-test.html" alt="QR Mesa Ratona en Cruz NODO">
  <small>El QR abre este mismo visor en el teléfono.</small>
</div>

<script>
const viewer=document.getElementById('viewer');
document.getElementById('arBtn').addEventListener('click',()=>{
  if(viewer.activateAR) viewer.activateAR();
});
</script>
</body>
</html>
