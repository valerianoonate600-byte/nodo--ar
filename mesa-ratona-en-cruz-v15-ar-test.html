<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NODO · Mesa Ratona en Cruz · AR TEST</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f6f2;font-family:Arial,Helvetica,sans-serif;color:#111}
.wrap{max-width:1100px;margin:auto;padding:16px}
h1{text-align:center;font-size:18px;margin:6px 0 12px}
.ar{display:block;margin:0 auto 12px;border:1px solid #111;background:#111;color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;font-size:16px;cursor:pointer}
.note{text-align:center;font-size:13px;color:#666;margin:0 0 12px}
model-viewer{width:100%;height:72vh;min-height:520px;background:#fff;border-radius:18px}
</style>
</head>
<body>
<div class="wrap">
<h1>MESA RATONA EN CRUZ · PRUEBA AR</h1>
<button class="ar" id="arBtn">PROBALO EN TU CASA</button>
<div class="note">Prueba Kiri · misma arquitectura interna de escala/ejes usada en el Rack AR.</div>

<model-viewer id="viewer"
  src="NODO_MESA_RATONA_EN_CRUZ_KIRI_V15_AR_PIPELINE_RACK.glb"
  camera-controls
  touch-action="pan-y"
  shadow-intensity="1"
  shadow-softness=".8"
  exposure="1"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-placement="floor"
  ar-scale="fixed"
  environment-image="neutral">
</model-viewer>
</div>
<script>
const viewer=document.getElementById('viewer');
document.getElementById('arBtn').addEventListener('click',()=>{
  if(viewer.activateAR) viewer.activateAR();
});
</script>
</body>
</html>
