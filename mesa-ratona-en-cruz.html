<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NODO · Mesa Ratona en Cruz</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f4f4;font-family:Arial,Helvetica,sans-serif;color:#111}
.wrap{max-width:1100px;margin:auto;padding:14px}
h1{text-align:center;font-size:18px;margin:5px 0 10px}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0 10px}
.controls button,.ar{border:1px solid #222;background:#fff;color:#222;padding:10px 18px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer}
.controls button.active{background:#222;color:#fff}
.ar{display:block;margin:0 auto 10px;padding:11px 24px}
.note{text-align:center;font-size:13px;color:#555;margin-bottom:8px}
model-viewer{width:100%;height:76vh;min-height:520px;background:#fff;border-radius:12px}
@media(max-width:700px){model-viewer{height:72vh;min-height:480px}.wrap{padding:8px}}
</style>
</head>
<body>
<div class="wrap">
<h1>MESA RATONA EN CRUZ · NODO</h1>
<div class="controls">
<button class="active" data-src="NODO_MESA_RATONA_EN_CRUZ_KIRI_V6.glb">KIRI</button>
<button data-src="NODO_MESA_RATONA_EN_CRUZ_PARAISO_V6.glb">PARAÍSO</button>
<button data-src="NODO_MESA_RATONA_EN_CRUZ_CUARZO_V6.glb">CUARZO</button>
</div>
<button class="ar" id="arBtn">PROBALO EN TU CASA</button>
<div class="note">Elegí el color, girá la mesa y probala en tu casa desde el celular.</div>
<model-viewer id="viewer"
src="NODO_MESA_RATONA_EN_CRUZ_KIRI_V6.glb?v=6"
camera-controls touch-action="pan-y"
shadow-intensity="1" shadow-softness=".8"
exposure="1" environment-image="neutral"
ar ar-modes="webxr scene-viewer quick-look"
ar-placement="floor" ar-scale="fixed">
</model-viewer>
</div>
<script>
const viewer=document.getElementById('viewer');
const buttons=[...document.querySelectorAll('.controls button')];
buttons.forEach(btn=>btn.addEventListener('click',()=>{
  buttons.forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  viewer.setAttribute('src',btn.dataset.src+'?v=6');
}));
document.getElementById('arBtn').addEventListener('click',()=>{
  if(viewer.activateAR) viewer.activateAR();
});
</script>
</body>
</html>
